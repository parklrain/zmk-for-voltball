CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y

# Non-LiPo Battery Management for Ni-MH batteries
# Circuit: Voltage divider with R2=1MΩ, R3=1MΩ
# Divider ratio = 1000k / (1000k + 1000k) = 0.5
#
# Battery voltage ranges (actual):
#   MIN = 1100mV (0%)    →  ADC = 1100 * 0.5 = 550mV
#   MAX = 1400mV (100%)  →  ADC = 1400 * 0.5 = 700mV  
#   LOW = 1050mV (shutdown) → ADC = 1050 * 0.5 = 525mV
#
# Battery profile for 1xAA setup.
CONFIG_ZMK_STATUS_LED=y
CONFIG_ZMK_NON_LIPO_MAX_MV=700
CONFIG_ZMK_NON_LIPO_MIN_MV=550
CONFIG_ZMK_NON_LIPO_LOW_MV=525
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=60000

# Split Keyboard Wake/Sleep Settings
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# For zmk battery center
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y

# For split keyboards:
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# BLE Connection Stability Improvements
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# For status led
CONFIG_ZMK_STATUS_LED=y

# External Power Control
CONFIG_ZMK_EXT_POWER=y
